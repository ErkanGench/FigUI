# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false

  tools:
    github-checks:
      enabled: true

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/.cache/**"
    - "!**/.temp/**"
    - "!**/package-lock.json"
    - "!**/*.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.ico"
    - "!**/*.woff"
    - "!**/*.woff2"

  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Focus on correctness, type safety, React state flow, and user-visible regressions.
        Treat ESP32 bundle size as a primary constraint; follow the README's contribution guidelines.
        Use the ESP32 bundle size workflow's measured final dist/index.html.gz sizes when available.
        Flag disproportionate growth, duplicated UI/SVG/logic, and costly new dependencies; suggest shared code or optional plugins while preserving machine-control safeguards.
        Do not invent byte savings or infer deployed size from source line counts. Dynamic imports are inlined by the ESP32 build and do not save flash on their own.
    - path: "package.json"
      instructions: |
        Check new runtime dependencies for their effect on the final ESP32 bundle and whether existing utilities or browser APIs can meet the need.
        Ask for measured before/after dist/index.html.gz sizes when runtime dependencies change.
    - path: "plugins/**"
      instructions: |
        Review plugin changes for browser compatibility, sandboxing assumptions, and integration risks.
        For store plugins, verify each plugin folder has a proper plugin.json manifest and a matching plugins/registry.json entry.
        Confirm manifest metadata stays consistent with the registry: id, name, description, version, author, entry, base URL, and files.
        Require the icon file to be named exactly "icon.png", referenced as "icon.png" in plugin.json, included in files when files is present, and available beside the manifest.
        Flag missing plugin.json files, malformed JSON, stale registry versions, incorrect base URLs, or registry entries that do not point to the plugin folder.
    - path: "scripts/**"
      instructions: |
        Review scripts for portability, clear failure behavior, and accidental destructive operations.
        Bundle size comparisons must use the final ESP32 artifacts, report missing or failed builds as errors, and keep warning thresholds visible and configurable.

chat:
  auto_reply: true
